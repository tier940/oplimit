# Builds both versions in one Gradle invocation from the repository root.
name: Build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # RetroFuturaGradle (1.12.2) and ForgeGradle (1.20.1) both run on Java 17. The Java 8
      # toolchain the 1.12.2 mod compiles against is provisioned by Gradle itself.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: |
            caches
            caches/retro_futura_gradle
            notifications
            jdks
            wrapper

      - name: Build
        run: ./gradlew --info --stacktrace build

      - name: Upload Jars
        uses: actions/upload-artifact@v7
        with:
          name: oplimitbypass-jars
          path: |
            1.12.2/build/libs/*.jar
            1.20.1/build/libs/*.jar
          retention-days: 31
