# Publishes a GitHub Release with both version jars attached.
#
# Run it from the Actions tab and give it a version: the workflow writes modVersion into
# gradle.properties, commits that, tags it, builds, and publishes the release. Nothing has to be
# tagged locally beforehand.
name: Publish Project

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Mod version (e.g. 1.0.0)'
        required: true
      release_type:
        description: 'Release type'
        type: choice
        default: 'release'
        options:
          - 'release'
          - 'beta'
          - 'alpha'
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        type: boolean
        default: false

env:
  FULL_VERSION: "${{ github.event.inputs.release_type == 'release' && github.event.inputs.version || format('{0}-{1}', github.event.inputs.version, github.event.inputs.release_type) }}"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-tags: true

      - name: Check if tag already exists
        run: |
          if git rev-parse --verify --quiet "refs/tags/v${FULL_VERSION}"; then
              echo "Tag v${FULL_VERSION} already exists, aborting." >&2
              exit 1
          fi

      - name: Set version
        run: sed -i "s/^modVersion *=.*/modVersion = ${FULL_VERSION}/" gradle.properties

      - name: Commit and tag
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Bump version to v${{ env.FULL_VERSION }}"
          commit_options: '--no-verify'
          file_pattern: gradle.properties
          tagging_message: "v${{ env.FULL_VERSION }}"

      # RetroFuturaGradle (1.12.2) and ForgeGradle (1.20.1) both run on Java 17. The Java 8
      # toolchain the 1.12.2 mod compiles against is provisioned by Gradle itself.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-includes: |
            caches
            caches/retro_futura_gradle
            notifications
            jdks
            wrapper

      - name: Build Project
        run: ./gradlew --info --stacktrace build

      # Both subprojects produce oplimitbypass-<version>.jar, so the Minecraft version has to go
      # into the released filename. The -dev jar is deobfuscated and deliberately not published.
      - name: Collect jars
        run: |
          set -euo pipefail
          mkdir -p release
          for mc in 1.12.2 1.20.1; do
              src="${mc}/build/libs/oplimitbypass-${FULL_VERSION}.jar"
              test -f "$src"
              cp "$src" "release/oplimitbypass-${mc}-${FULL_VERSION}.jar"
          done
          ls -l release

      # The build already fails without a refmap; this re-checks the files actually being released,
      # since a jar whose mixins never apply is the one defect that looks completely healthy.
      - name: Verify both jars carry their refmap
        run: |
          set -euo pipefail
          unzip -p "release/oplimitbypass-1.12.2-${FULL_VERSION}.jar" mixins.oplimitbypass.refmap.json | grep -q func_
          unzip -p "release/oplimitbypass-1.20.1-${FULL_VERSION}.jar" oplimitbypass.refmap.json | grep -q m_
          echo "refmap OK for both"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}
        run: |
          set -euo pipefail
          # The tag was pushed by the commit step above; --target keeps the release pinned to it
          # rather than to whatever the runner happens to have checked out.
          args=(--title "OpLimitBypass ${FULL_VERSION}" --generate-notes --target "v${FULL_VERSION}")
          if [ "$PRERELEASE" = true ] || [ "$RELEASE_TYPE" != release ]; then
              args+=(--prerelease)
          fi
          gh release create "v${FULL_VERSION}" release/*.jar "${args[@]}"
