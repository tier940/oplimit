# Compiles common/ the way both versions will, so a change that only breaks the *other* version
# is caught here instead of in a full Forge build.
name: Check common

on:
  pull_request:
    paths: ['common/**', 'scripts/check-common.sh']
  push:
    branches: [master]
    paths: ['common/**', 'scripts/check-common.sh']
  workflow_dispatch:

concurrency:
  group: check-common-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check-common:
    name: Compile shared sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # --release 8 and --release 17 both work from a single modern JDK.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compile common/ for both versions
        run: ./scripts/check-common.sh
