# Read from the build root only. Subprojects do not get their own gradle.properties in a
# multi-project build, so everything both versions need has to live here.

# Effectively applies the '--stacktrace' flag by default.
org.gradle.logging.stacktrace = all
# RetroFuturaGradle decompiles Minecraft in-process and needs the headroom.
org.gradle.jvmargs = -Xmx3G
# Run independent tasks in parallel to speed up builds.
org.gradle.parallel = true
# Reuse outputs from previous builds via the build cache.
org.gradle.caching = true

# The single source of truth for the mod's identity. Both build.gradle files read these, and they
# are expanded into mcmod.info / mods.toml and generated into Tags.java, so no version string is
# ever written by hand.
modId = oplimitbypass
modName = OpLimitBypass
modVersion = 1.0.0-alpha
modAuthor = tier940
